<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOTYPE — 开场与菜单</title>
<style>
  /* ============================================================
     PROTOTYPE (throwaway) — 回答的问题：
     "开场 → 点击任意处 → 头像右移 + 左侧菜单浮现" 这个交互。
     变体 A（经典游戏标题菜单）已胜出，B/C 变体与切换条已移除。
     背景：暂时为 #2E3A58 纯色（用户指示全部推倒重来，样式待定）。
     头像：avatar.jpg（用户提供照片）；网名：fghmnst。
     菜单：英文选项 + BigBlue 字体。
     ============================================================ */

  :root {
    --bg:      #2E3A58;   /* 纯色背景（临时，已加深） */
    --panel:   #4E6496;   /* 按钮底色（提亮一档，避免与背景同色） */
    --line:    #58618E;   /* 暮紫蓝 — 边框/描边 */
    --ink:     #F3B280;   /* 杏黄橙 — 主文字 */
    --ink-soft:#896B85;   /* 灰粉紫 — 次级文字 */
    --hover:   #794F74;   /* 紫罗兰 — 悬停底色 */
    --accent:  #CD7A6D;   /* 暖桃粉 — 强调色 */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'BigBlue';
    src: url('fonts/BigBlueTerm437NerdFont-Regular.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Mononoki';
    src: url('fonts/MononokiNerdFont-Regular.ttf') format('truetype');
  }

  html, body { height: 100%; }
  body {
    font-family: 'Mononoki', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }

  #app {
    position: fixed; inset: 0;
    background: var(--bg);
  }

  /* ---------- 开场：头像 + 网名（整体缩放，点击后放大右移） ---------- */
  #stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px;
    cursor: pointer;
    z-index: 2;
  }
  body.started #stage { cursor: default; }

  .hero {
    display: flex; flex-direction: column;
    align-items: center; gap: 14px;
    transform: scale(.7);               /* 开场：缩小 */
    transition: transform .9s cubic-bezier(.34,1.3,.5,1);
  }
  body.started .hero { transform: translateX(23vw) scale(1.25); }  /* 点击后：放大 + 右移 */

  #avatar {
    width: 110px; height: 110px;
    filter: drop-shadow(6px 6px 0 rgba(0,0,0,.5));
  }
  #avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  body.started #avatar { animation: bob 2.6s ease-in-out infinite; }  /* 待机晃动（招牌动效 2） */
  @keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: -9px; } }

  .handle {
    font-family: 'BigBlue', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    font-size: 30px;
    letter-spacing: 4px;
  }

  /* ---------- 菜单：经典游戏标题菜单（变体 A 胜出） ---------- */
  .menu {
    position: absolute; z-index: 3;
    display: none;
    top: 50%; left: 10%;
    transform: translateY(-50%);
    flex-direction: column; gap: 30px;
  }
  body.started .menu { display: flex; }

  .menu-label {
    font-family: 'BigBlue', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    font-size: 13px; letter-spacing: 4px; color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .btn {
    font-family: 'BigBlue', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    font-size: 26px; color: var(--ink);
    background: var(--panel);
    border: 4px solid var(--line);
    box-shadow: 4px 4px 0 rgba(0,0,0,.5);
    padding: 18px 60px;
    cursor: pointer;
    transition: transform .08s, box-shadow .08s, background .15s;
    text-align: center;
  }
  .btn:hover {
    background: var(--hover);
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 rgba(0,0,0,.5);
  }
  .btn:active { transform: translate(4px,4px); box-shadow: none; }
</style>
</head>
<body id="app">
  <noscript><p style="padding:20px">请启用 JavaScript 以查看原型。</p></noscript>

  <!-- 开场画面 -->
  <div id="stage">
    <div class="hero">
      <div id="avatar"><img src="avatar.jpg" alt="fghmnst"></div>
      <h1 class="handle">fghmnst</h1>
    </div>
  </div>

  <!-- 菜单 -->
  <nav class="menu">
    <div class="menu-label">— MENU —</div>
    <button class="btn">WELCOME</button>
    <button class="btn">OPTION II</button>
    <button class="btn">OPTION III</button>
  </nav>

<script>
  /* ============ 交互：点击任意处开始 ============ */
  const stage = document.getElementById("stage");
  stage.addEventListener("click", () => document.body.classList.add("started"));
</script>
</body>
</html>
