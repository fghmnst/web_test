<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOTYPE — 开场与菜单</title>
<style>
  /* ============================================================
     PROTOTYPE (throwaway) — 回答的问题：
     "开场 → 点击任意处 → 头像右移 + 左侧菜单浮现" 这个交互。
     变体 A（经典游戏标题菜单）已胜出，B/C 变体与切换条已移除。
     配色已切换为暮紫蓝系 7 色（用户提供，待确认）。
      网名与头像均为占位。
     ============================================================ */

  :root {
    --bg:      #0D1322;   /* 暗墨蓝 — 页面背景 */
    --panel:   #3D4E75;   /* 蓝紫雾 — 面板/按钮底色 */
    --line:    #58618E;   /* 暮紫蓝 — 边框/描边 */
    --ink:     #F3B280;   /* 杏黄橙 — 主文字 */
    --ink-soft:#896B85;   /* 灰粉紫 — 次级文字 */
    --hover:   #794F74;   /* 紫罗兰 — 悬停底色 */
    --accent:  #CD7A6D;   /* 暖桃粉 — 强调色 */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'BigBlue';
    src: url('fonts/BigBlueTerm437NerdFont-Regular.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Mononoki';
    src: url('fonts/MononokiNerdFont-Regular.ttf') format('truetype');
  }

  html, body { height: 100%; }
  body {
    font-family: 'Mononoki', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }

  #app {
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 90% at 30% 20%, #1b2447 0%, var(--bg) 55%, #060a15 100%);
  }

  /* ---------- 像素云（招牌动效 1：缓慢漂移） ---------- */
  .cloud {
    position: absolute;
    opacity: .55;
    image-rendering: pixelated;
    animation: drift linear infinite;
    pointer-events: none;
  }
  .cloud svg { display: block; width: 100%; height: 100%; }
  .c1 { width: 180px; height: 40px; top: 12%; left: -200px;  animation-duration: 90s; }
  .c2 { width: 120px; height: 28px; top: 30%; left: -140px;  animation-duration: 65s; }
  .c3 { width: 150px; height: 34px; top: 62%; left: -170px;  animation-duration: 110s; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 400px)); } }

  /* ---------- 开场：头像 + 网名（整体缩放，点击后放大右移） ---------- */
  #stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px;
    cursor: pointer;
    z-index: 2;
  }
  body.started #stage { cursor: default; }
  body.started #stage .press { opacity: 0; }

  .hero {
    display: flex; flex-direction: column;
    align-items: center; gap: 14px;
    transform: scale(.7);               /* 开场：缩小 */
    transition: transform .9s cubic-bezier(.34,1.3,.5,1);
  }
  body.started .hero { transform: translateX(23vw) scale(1.25); }  /* 点击后：放大 + 右移 */

  #avatar {
    width: 150px; height: 150px;
    filter: drop-shadow(6px 6px 0 rgba(0,0,0,.5));
  }
  #avatar svg { width: 100%; height: 100%; shape-rendering: crispEdges; }
  body.started #avatar { animation: bob 2.6s ease-in-out infinite; }  /* 待机晃动（招牌动效 2） */
  @keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: -12px; } }

  .handle {
    font-family: 'BigBlue', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    font-size: 42px;
    letter-spacing: 6px;
  }

  .press {
    font-size: 15px;
    color: var(--ink-soft);
    animation: blink 1.6s steps(1) infinite;
    transition: opacity .3s ease;
  }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: .12; } }

  /* ---------- 菜单：经典游戏标题菜单（变体 A 胜出） ---------- */
  .menu {
    position: absolute; z-index: 3;
    display: none;
    top: 50%; left: 10%;
    transform: translateY(-50%);
    flex-direction: column; gap: 22px;
  }
  body.started .menu { display: flex; }

  .menu-label {
    font-family: 'BigBlue', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    font-size: 13px; letter-spacing: 4px; color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .btn {
    font-family: 'Mononoki', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    font-size: 20px; color: var(--ink);
    background: var(--panel);
    border: 4px solid var(--line);
    box-shadow: 4px 4px 0 rgba(0,0,0,.5);
    padding: 14px 46px;
    cursor: pointer;
    transition: transform .08s, box-shadow .08s, background .15s;
    text-align: center;
  }
  .btn:hover {
    background: var(--hover);
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 rgba(0,0,0,.5);
  }
  .btn:active { transform: translate(4px,4px); box-shadow: none; }
</style>
</head>
<body id="app">
  <noscript><p style="padding:20px">请启用 JavaScript 以查看原型。</p></noscript>

  <!-- 开场画面 -->
  <div id="stage">
    <div class="cloud c1" id="cloud-a"></div>
    <div class="cloud c2" id="cloud-b"></div>
    <div class="cloud c3" id="cloud-c"></div>
    <div class="hero">
      <div id="avatar"></div>
      <h1 class="handle">FGH</h1>
    </div>
    <p class="press">点击任意处开始</p>
  </div>

  <!-- 菜单 -->
  <nav class="menu">
    <div class="menu-label">— MENU —</div>
    <button class="btn">欢迎</button>
    <button class="btn">选项二</button>
    <button class="btn">选项三</button>
  </nav>

<script>
  /* ============ 像素素材：代码生成（占位头像 + 装饰） ============ */

  const AVATAR_MAP = [
    "....hhhhhhhh....",
    "..hhhhhhhhhhhh..",
    ".hhhhhhhhhhhhhh.",
    ".hhhhsssssshhhh.",
    "hhsssssssssssshh",
    "hhsssssssssssshh",
    "hssssssssssssssh",
    "ssssssssssssssss",
    "sssseesssseessss",
    "sssseesssseessss",
    "sssbbssssssbbsss",
    "ssssssmmmmssssss",
    "ssssssssssssssss",
    "ssssssssssssssss",
    "tttttttttttttttt",
    "tttttttttttttttt"
  ];
  const AVATAR_PALETTE = {
    h: "#4a3b32",  // 发色
    s: "#efd3b3",  // 肤色
    e: "#3d3a36",  // 眼睛
    b: "#d9a08a",  // 腮红
    m: "#b06a5b",  // 嘴
    t: "#58618E"   // 衣服（暮紫蓝）
  };

  function pixelSvg(map, palette, scale = 1) {
    const h = map.length, w = map[0].length;
    let rects = "";
    map.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const c = row[x];
        if (c === "." || !palette[c]) continue;
        rects += `<rect x="${x*scale}" y="${y*scale}" width="${scale}" height="${scale}" fill="${palette[c]}"/>`;
      }
    });
    return `<svg viewBox="0 0 ${w*scale} ${h*scale}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
  }

  const cloudSvg = (w, h, color) => {
    const blocks = [];
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++)
        if (Math.random() > 0.35) blocks.push(`<rect x="${x*10}" y="${y*10}" width="10" height="10" fill="${color}"/>`);
    return `<svg viewBox="0 0 ${w*10} ${h*10}" xmlns="http://www.w3.org/2000/svg">${blocks.join("")}</svg>`;
  };

  /* ============ 渲染 ============ */
  document.getElementById("avatar").innerHTML = pixelSvg(AVATAR_MAP, AVATAR_PALETTE);
  document.getElementById("cloud-a").innerHTML = cloudSvg(18, 4, "#58618E");
  document.getElementById("cloud-b").innerHTML = cloudSvg(12, 3, "#58618E");
  document.getElementById("cloud-c").innerHTML = cloudSvg(15, 3, "#58618E");

  /* ============ 交互：点击任意处开始 ============ */
  const stage = document.getElementById("stage");
  stage.addEventListener("click", () => document.body.classList.add("started"));
</script>
</body>
</html>
